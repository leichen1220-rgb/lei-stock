name: Stock ledger checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cost-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/page-syntax.test.cjs
      - run: node tests/page-syntax.test.cjs
      - run: node --check tests/cost-ledger.test.cjs
      - run: node tests/cost-ledger.test.cjs
      - run: node tests/excel-cost.test.cjs
      - run: node tests/import-preflight.test.cjs
      - run: node tests/import-staging.test.cjs
      - run: node tests/paid-cost-migration.test.cjs
      - run: node tests/market-prices.test.cjs
      - run: node tests/wire-confirmation.test.cjs
      - run: node tests/name-import.test.cjs
      - run: node tests/bank-import.test.cjs
      - run: python -m unittest discover -s tests -p '*_test.py'
