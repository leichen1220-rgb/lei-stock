name: Stock ledger checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cost-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/cost-ledger.test.cjs
      - run: node tests/cost-ledger.test.cjs
